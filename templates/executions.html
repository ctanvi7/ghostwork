{% extends "base.html" %}

{% block title %}Executions — GhostWork{% endblock %}

{% block content %}
<div class="executions-page">
    <section class="page-header">
        <h1>Executions</h1>
        <p class="page-subtitle">Autonomous workflow runs and their results.</p>
    </section>

    <div id="loading" class="loading-state">
        <p>Loading executions...</p>
    </div>

    <div id="error" class="error-state" style="display:none;">
        <p>Unable to load executions. <button id="retry-btn">Try again</button></p>
    </div>

    <div id="content" style="display:none;">
        <div class="executions-list" id="executions-list">
            <!-- Populated by JavaScript -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/executions.js') }}"></script>
{% endblock %}
